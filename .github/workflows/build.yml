name: Build Windows + Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Set up Haxelib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/.haxelib" | Out-Null
          haxelib setup "$env:GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          haxelib install hxcpp 4.3.2 --always
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib set hxcpp 4.3.2
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      - name: Build Windows
        shell: pwsh
        run: haxelib run lime build windows -release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Windows
          path: export/release/windows/bin/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          echo "Cleaning any incomplete NDK installation..."
          rm -rf "$NDK_DIR"

          # sdkmanager can leave a corrupted archive behind after a failed download.
          # Remove only cached NDK archives before retrying the installation.
          if [ -d "$HOME/.android" ]; then
            find "$HOME/.android" -type f \( -iname '*21.4.7075529*' -o -iname '*android-ndk-r21e*' \) -delete || true
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-31" "build-tools;31.0.0"

          for attempt in 1 2 3; do
            echo "Installing NDK 21.4.7075529 (attempt $attempt/3)..."
            rm -rf "$NDK_DIR"

            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;21.4.7075529"
            SDK_EXIT=$?
            set -o pipefail

            # sdkmanager can exit non-zero when the confirmation pipe closes
            # after it has finished reading the license prompt. The real
            # validation is whether the NDK was completely installed.
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "OK: NDK 21.4.7075529 installed correctly."
              break
            fi

            echo "NDK installation failed or is incomplete (sdkmanager exit: $SDK_EXIT)."
            rm -rf "$NDK_DIR"

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not install NDK 21.4.7075529 after 3 attempts."
              exit 1
            fi

            sleep 5
          done

          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "NDK version:"
          grep 'Pkg.Revision' "$NDK_DIR/source.properties"

      - name: Set up Haxelib
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.haxelib"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        shell: bash
        run: |
          haxelib install hxcpp 4.3.2 --always
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib set hxcpp 4.3.2
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      - name: Configure Android ABIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Project.xml")
          text = path.read_text(encoding="utf-8")

          architectures = [
              '  <architecture name="armeabi-v7a" if="android" />',
              '  <architecture name="arm64-v8a" if="android" />',
              '  <architecture name="x86_64" if="android" />',
          ]

          missing = [line for line in architectures if line not in text]
          if missing:
              marker = "</project>"
              text = text.replace(marker, "\n" + "\n".join(missing) + "\n" + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          echo "Android architectures configured:"
          grep '<architecture name=' Project.xml || true

      - name: Configure Android build
        shell: bash
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          haxelib run lime setup android

          # Discord Rich Presence is desktop-only.
          # Keep hxdiscord_rpc completely out of the Android dependency graph.
          if grep -Eq '<define name="DISCORD_ALLOWED"[^>]*if="desktop"' Project.xml; then
            echo "OK: DISCORD_ALLOWED is desktop-only."
          else
            echo "ERROR: DISCORD_ALLOWED is not restricted to desktop."
            exit 1
          fi

          if grep -q '<haxelib name="hxdiscord_rpc"' Project.xml && ! grep -q '<haxelib name="hxdiscord_rpc"[^>]*if="DISCORD_ALLOWED"' Project.xml; then
            echo "ERROR: hxdiscord_rpc is not conditionally disabled for Android."
            exit 1
          fi

          if haxelib list | grep -q '^hxdiscord_rpc'; then
            echo "ERROR: hxdiscord_rpc is installed in the Android build environment."
            exit 1
          fi

          echo "OK: hxdiscord_rpc is not installed for Android."

          echo "Checking hxcpp:"
          haxelib path hxcpp
          if ! haxelib path hxcpp >/dev/null 2>&1; then
            echo "ERROR: hxcpp is not installed correctly."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          if grep -Eq '<define name="DISCORD_ALLOWED"[^>]*if="desktop"' Project.xml; then
            echo "OK: Android build uses desktop-only Discord support."
          else
            echo "ERROR: Discord support is not restricted to desktop."
            exit 1
          fi

          if haxelib list | grep -q '^hxdiscord_rpc'; then
            echo "ERROR: hxdiscord_rpc is installed during Android build."
            exit 1
          fi

          if ! haxelib path hxcpp >/dev/null 2>&1; then
            echo "ERROR: hxcpp is not installed correctly."
            exit 1
          fi

          echo "OK: hxcpp is installed:"
          haxelib path hxcpp

          haxelib run lime clean android
          haxelib run lime build android -release

      - name: Verify Android native libraries
        shell: bash
        run: |
          set -e

          APK="$(find export -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK: $APK"
          echo "Native libraries inside APK:"
          unzip -l "$APK" | grep 'lib/.*/libApplicationMain.so' || true

          APP_LIB="$(find export -type f -path '*/arm64-v8a/libApplicationMain.so' | head -n 1)"

          if [ -n "$APP_LIB" ] && command -v llvm-nm >/dev/null 2>&1; then
            echo "Checking ARM64 native library: $APP_LIB"
            if llvm-nm -D "$APP_LIB" 2>/dev/null | grep -q 'BaseConnection.*Open'; then
              echo "ERROR: Discord BaseConnection::Open is still referenced by libApplicationMain.so"
              exit 1
            fi
            echo "OK: Discord BaseConnection::Open is not referenced."
          fi

      - name: Verify Android APK architectures
        shell: bash
        run: |
          set -e

          APK="$(find export -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK: $APK"
          echo "Native libraries inside APK:"
          unzip -l "$APK" | grep 'lib/.*/libApplicationMain.so' || true

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libApplicationMain.so"; then
              echo "OK: $ABI"
            else
              echo "WARNING: $ABI was not included in the APK."
            fi
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Android
          path: export/**/*.apk
          if-no-files-found: error
          retention-days: 14
