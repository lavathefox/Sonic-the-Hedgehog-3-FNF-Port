name: Build Windows + Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Set up Haxelib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/.haxelib" | Out-Null
          haxelib setup "$env:GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        shell: pwsh
        run: |
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hxdiscord_rpc 1.2.4 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      - name: Build Windows
        shell: pwsh
        run: haxelib run lime build windows -release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Windows
          path: export/release/windows/bin/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "ndk;21.4.7075529"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Set up Haxelib
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.haxelib"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        shell: bash
        run: |
          haxelib install lime 8.1.2 --always
          haxelib install openfl 9.3.3 --always
          haxelib install flixel 5.6.1 --always
          haxelib install flixel-addons 3.2.2 --always
          haxelib install flixel-tools 1.5.1 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hxdiscord_rpc 1.2.4 --always
          haxelib install hxvlc 2.0.1 --skip-dependencies --always
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      - name: Configure Android ABIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Project.xml")
          text = path.read_text(encoding="utf-8")

          architectures = [
              '  <architecture name="armeabi-v7a" if="android" />',
              '  <architecture name="arm64-v8a" if="android" />',
              '  <architecture name="x86_64" if="android" />',
          ]

          missing = [line for line in architectures if line not in text]
          if missing:
              marker = "</project>"
              text = text.replace(marker, "\n" + "\n".join(missing) + "\n" + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          echo "Android architectures configured:"
          grep '<architecture name=' Project.xml || true

      - name: Configure Lime for Android
        shell: bash
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          haxelib run lime setup android

      - name: Build Android APK
        shell: bash
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          haxelib run lime clean android
          haxelib run lime build android -release

      - name: Verify Android APK architectures
        shell: bash
        run: |
          set -e

          APK="$(find export -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK: $APK"
          echo "Native libraries inside APK:"
          unzip -l "$APK" | grep 'lib/.*/libApplicationMain.so' || true

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libApplicationMain.so"; then
              echo "OK: $ABI"
            else
              echo "WARNING: $ABI was not included in the APK."
            fi
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Android
          path: export/**/*.apk
          if-no-files-found: error
          retention-days: 14
