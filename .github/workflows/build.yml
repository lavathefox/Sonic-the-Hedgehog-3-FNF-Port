name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - '.github/workflows/claude.yml'
      - '.github/workflows/html5.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to build
        type: choice
        default: default
        options:
          - default
          - windows
          - android
          - linux
          - all
      build_type:
        description: Build type
        type: choice
        default: release
        options:
          - release
          - debug
      android_abis:
        description: Android architectures
        type: choice
        default: arm64
        options:
          - arm64
          - arm64+armv7
          - all
      clean_cache:
        description: Ignore the compiled object cache
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  HAXE_VERSION: 4.3.4
  NDK_VERSION: 21.4.7075529
  ANDROID_PLATFORM: android-31
  ANDROID_BUILD_TOOLS: 31.0.0
  APP_NAME: Sonic3-FNF-Port
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}
  ANDROID_ABIS: ${{ inputs.android_abis || 'arm64' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-latest' || matrix.target == 'linux' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets == 'all' && '["windows","android","linux"]' || contains(fromJSON('["windows","android","linux"]'), inputs.targets) && format('["{0}"]', inputs.targets) || '["windows","android"]') }}

    outputs:
      version: ${{ steps.info.outputs.version }}

    env:
      TARGET: ${{ matrix.target }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build info
        id: info
        timeout-minutes: 1
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<app[^>]*version="\([^"]*\)".*/\1/p' Project.xml | head -n 1)
          [ -n "$version" ] || version="0.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"
            echo "SHORT_SHA=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_ENV"
          echo "Target: $TARGET | Version: $version | Type: $BUILD_TYPE"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        timeout-minutes: 5
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Linux packages
        if: matrix.target == 'linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libvlc-dev libvlccore-dev vlc-bin libgl1-mesa-dev libasound2-dev

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4
        timeout-minutes: 10
        with:
          packages: platform-tools

      - name: Locate Android SDK
        if: matrix.target == 'android'
        id: sdk
        run: echo "root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK and NDK
        if: matrix.target == 'android'
        id: android-cache
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/ndk/${{ env.NDK_VERSION }}
            ${{ steps.sdk.outputs.root }}/platforms/${{ env.ANDROID_PLATFORM }}
            ${{ steps.sdk.outputs.root }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-ndk${{ env.NDK_VERSION }}-${{ env.ANDROID_PLATFORM }}-bt${{ env.ANDROID_BUILD_TOOLS }}-v2

      - name: Install Android SDK and NDK
        if: matrix.target == 'android' && steps.android-cache.outputs.cache-hit != 'true'
        timeout-minutes: 50
        run: |
          set -euo pipefail
          exec < /dev/null
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found at $sdkmanager"
            exit 1
          fi

          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true

          install_package() {
            local package="$1" check="$2" attempt=1
            while [ "$attempt" -le 3 ]; do
              [ -f "$check" ] && { echo "Ready: $package"; return 0; }
              echo "::group::Installing $package ($attempt/3)"
              set +e
              yes | timeout 15m "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "$package" > /dev/null
              set -e
              echo "::endgroup::"
              [ -f "$check" ] && { echo "Ready: $package"; return 0; }
              echo "::warning::$package is incomplete, retrying"
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::Failed to install $package"
            return 1
          }

          install_package "platforms;$ANDROID_PLATFORM" "$ANDROID_SDK_ROOT/platforms/$ANDROID_PLATFORM/android.jar"
          install_package "build-tools;$ANDROID_BUILD_TOOLS" "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          install_package "ndk;$NDK_VERSION" "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/source.properties"

      - name: Export Android paths
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -f "$ndk/source.properties" ]; then
            echo "::error::NDK $NDK_VERSION is missing"
            exit 1
          fi
          {
            echo "ANDROID_SDK=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      - name: Cache Gradle
        if: matrix.target == 'android'
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Haxe libraries
        id: haxelib-cache
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: .haxelib
          key: haxelib-${{ matrix.target }}-${{ env.HAXE_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Restore compiled objects
        if: inputs.clean_cache != true
        uses: actions/cache/restore@v4
        timeout-minutes: 10
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ matrix.target }}-${{ env.BUILD_TYPE }}-${{ env.ANDROID_ABIS }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ matrix.target }}-${{ env.BUILD_TYPE }}-${{ env.ANDROID_ABIS }}-
            hxcpp-${{ matrix.target }}-${{ env.BUILD_TYPE }}-

      - name: Set up Haxelib
        timeout-minutes: 2
        run: |
          exec < /dev/null
          mkdir -p "$GITHUB_WORKSPACE/.haxelib"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          exec < /dev/null
          lib() {
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "::group::haxelib $* ($attempt/3)"
              if timeout 8m haxelib --always "$@"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              echo "::warning::haxelib $* failed, retrying"
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::haxelib $* failed after 3 attempts"
            return 1
          }

          lib install hxcpp 4.3.2
          lib install lime 8.1.2
          lib install openfl 9.3.3
          lib install flixel 5.6.1
          lib install flixel-addons 3.2.2
          lib install flixel-tools 1.5.1
          lib install hscript-iris 1.1.3
          lib install tjson 1.4.0
          lib install hxvlc 2.0.1 --skip-dependencies
          if [ "$TARGET" != "android" ]; then
            lib install hxdiscord_rpc 1.2.4
          fi
          lib set hxcpp 4.3.2
          lib set lime 8.1.2
          lib set openfl 9.3.3
          lib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          lib git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          lib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          lib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      - name: Show installed libraries
        timeout-minutes: 1
        run: haxelib list < /dev/null

      - name: Configure Android project
        if: matrix.target == 'android'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          signing=false
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            signing=true
          fi

          python3 - "$ANDROID_ABIS" "$signing" "$RUNNER_TEMP/release.keystore" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          from xml.sax.saxutils import quoteattr

          abis, signing, keystore = sys.argv[1], sys.argv[2] == "true", sys.argv[3]
          path = Path("Project.xml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'\s*<architecture\b[^>]*/>', '', text)

          lines = {
              "arm64": ['<architecture name="arm64" exclude="armv7" if="android" />'],
              "arm64+armv7": ['<architecture name="armv7" if="android" />', '<architecture name="arm64" if="android" />'],
              "all": ['<architecture name="armv7" if="android" />', '<architecture name="arm64" if="android" />', '<architecture name="x86_64" if="android" />'],
          }[abis]

          if signing:
              password = os.environ["ANDROID_KEYSTORE_PASSWORD"]
              alias_password = os.environ.get("ANDROID_KEY_PASSWORD") or password
              lines.append(
                  "<certificate path=%s password=%s alias=%s alias-password=%s if=\"android\" />"
                  % (quoteattr(keystore), quoteattr(password), quoteattr(os.environ["ANDROID_KEY_ALIAS"]), quoteattr(alias_password))
              )

          block = "\n".join("\t" + line for line in lines)
          text = text.replace("</project>", block + "\n</project>", 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -E '<architecture' Project.xml
          if [ "$signing" = true ]; then
            echo "Release signing: enabled"
          else
            echo "::notice::Release signing secrets not set, the APK uses the default signing."
          fi

      - name: Configure Lime for Android
        if: matrix.target == 'android'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          exec < /dev/null
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build
        id: build
        timeout-minutes: 90
        run: |
          set -euo pipefail
          exec < /dev/null
          start=$(date +%s)
          haxelib run lime build "$TARGET" "-$BUILD_TYPE"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Save compiled objects
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        timeout-minutes: 10
        with:
          path: .hxcpp_cache
          key: hxcpp-${{ matrix.target }}-${{ env.BUILD_TYPE }}-${{ env.ANDROID_ABIS }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Package
        id: package
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p dist
          name="$APP_NAME-$VERSION-$TARGET"
          [ "$BUILD_TYPE" = "debug" ] && name="$name-debug"
          bin="export/$BUILD_TYPE/$TARGET/bin"

          case "$TARGET" in
            windows)
              7z a -tzip -mx=7 "dist/$name.zip" "./$bin/*" > /dev/null
              ;;
            linux)
              chmod +x "$bin"/* 2> /dev/null || true
              tar -czf "dist/$name.tar.gz" -C "$bin" .
              ;;
            android)
              apk=$(find export -type f -name '*.apk' -path "*$BUILD_TYPE*" | head -n 1)
              [ -n "$apk" ] || apk=$(find export -type f -name '*.apk' | head -n 1)
              if [ -z "$apk" ]; then
                echo "::error::No APK was produced"
                exit 1
              fi
              cp "$apk" "dist/$name.apk"
              ;;
          esac

          file=$(ls dist | head -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "dist/$file" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always() && !cancelled()
        env:
          FILE: ${{ steps.package.outputs.file }}
          SIZE: ${{ steps.package.outputs.size }}
          SECONDS_TAKEN: ${{ steps.build.outputs.seconds }}
        run: |
          {
            echo "### $TARGET"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${VERSION:-?} (${SHORT_SHA:-?}) |"
            echo "| Type | $BUILD_TYPE |"
            if [ "$TARGET" = "android" ]; then echo "| ABIs | $ANDROID_ABIS |"; fi
            if [ -n "${FILE:-}" ]; then
              echo "| File | \`$FILE\` |"
              echo "| Size | $SIZE |"
            else
              echo "| Result | Failed |"
            fi
            if [ -n "${SECONDS_TAKEN:-}" ]; then echo "| Build time | $((SECONDS_TAKEN / 60))m $((SECONDS_TAKEN % 60))s |"; fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: ${{ matrix.target == 'android' && '0' || '6' }}
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  notify-discord:
    name: Notify Discord
    needs: [build, release]
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Discord message
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set, skipping"
            exit 0
          fi

          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name | startswith("Build ")) | {name: (.name | sub("^Build "; "")), conclusion: (.conclusion // "unknown"), started: .started_at, completed: .completed_at}]' \
            || echo '[]')

          fields=$(echo "$jobs" | jq -c '[.[] | {
            name: (.name | ascii_upcase[0:1] + .[1:]),
            value: ((if .conclusion == "success" then "Success" else "Failed (" + .conclusion + ")" end)
              + (if .started and .completed then " in " + ((((.completed | fromdate) - (.started | fromdate)) / 60) | floor | tostring) + " min" else "" end)),
            inline: true
          }]')

          if [ "$BUILD_RESULT" = "success" ]; then
            if [ "$RELEASE_RESULT" = "success" ]; then
              title="Release $VERSION published"
              description="The builds are attached to the GitHub release."
              url="$RELEASE_URL"
              color=10181046
            else
              title="Build finished successfully"
              description="Open the run page and scroll to Artifacts to download the builds."
              url="$RUN_URL"
              color=3066993
            fi
          else
            title="Build failed"
            description="At least one build failed. Open the run page to see the logs."
            url="$RUN_URL"
            color=15158332
          fi

          first_line=$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n 1 | cut -c1-200)
          [ -n "$first_line" ] || first_line="Manual run"

          jq -n \
            --arg title "$title" \
            --arg description "$description" \
            --arg url "$url" \
            --argjson color "$color" \
            --argjson builds "$fields" \
            --arg version "${VERSION:-?} ($BUILD_TYPE)" \
            --arg ref "$REF_NAME" \
            --arg author "$ACTOR" \
            --arg commit "${GITHUB_SHA:0:7}: $first_line" \
            --arg event "$EVENT" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                fields: ($builds + [
                  { name: "Version", value: $version, inline: true },
                  { name: "Ref", value: $ref, inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Commit", value: $commit }
                ]),
                footer: { text: ("Trigger: " + $event) },
                timestamp: (now | todate)
              }]
            }' > payload.json

          curl -sS --fail-with-body --retry 3 --retry-delay 2 --max-time 30 \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
