name: Build Windows + Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # hxcpp compile cache: compiled object files are reused between runs,
  # so only the code that changed is rebuilt. This is the biggest speed-up.
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      # Keep this file at .github/workflows/build.yml: its hash is the cache key,
      # so changing a library version below refreshes the cache automatically.
      - name: Cache Haxe libraries
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-windows-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Cache hxcpp objects
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-windows-${{ github.sha }}
          restore-keys: |
            hxcpp-windows-

      - name: Set up Haxelib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/.haxelib" | Out-Null
          haxelib setup "$env:GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Haxelib {
            param([string[]]$Arguments)
            $label = $Arguments -join ' '
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "::group::haxelib $label (attempt $attempt/3)"
              & haxelib @Arguments
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($exitCode -eq 0) { return }
              if ($attempt -lt 3) {
                Write-Warning "haxelib $label failed with exit code $exitCode; retrying in 5 seconds."
                Start-Sleep -Seconds 5
              }
            }
            throw "haxelib $label failed after 3 attempts."
          }
          Invoke-Haxelib @('install', 'hxcpp', '4.3.2', '--always')
          Invoke-Haxelib @('install', 'lime', '8.1.2', '--always')
          Invoke-Haxelib @('install', 'openfl', '9.3.3', '--always')
          Invoke-Haxelib @('install', 'flixel', '5.6.1', '--always')
          Invoke-Haxelib @('install', 'flixel-addons', '3.2.2', '--always')
          Invoke-Haxelib @('install', 'flixel-tools', '1.5.1', '--always')
          Invoke-Haxelib @('install', 'hscript-iris', '1.1.3', '--always')
          Invoke-Haxelib @('install', 'tjson', '1.4.0', '--always')
          Invoke-Haxelib @('install', 'hxdiscord_rpc', '1.2.4', '--always')
          Invoke-Haxelib @('install', 'hxvlc', '2.0.1', '--skip-dependencies', '--always')
          Invoke-Haxelib @('set', 'hxcpp', '4.3.2')
          Invoke-Haxelib @('set', 'lime', '8.1.2')
          Invoke-Haxelib @('set', 'openfl', '9.3.3')
          Invoke-Haxelib @('git', 'flxanimate', 'https://github.com/Dot-Stuff/flxanimate', '768740a56b26aa0c072720e0d1236b94afe68e3e')
          Invoke-Haxelib @('git', 'linc_luajit', 'https://github.com/superpowers04/linc_luajit', '1906c4a96f6bb6df66562b3f24c62f4c5bba14a7')
          Invoke-Haxelib @('git', 'funkin.vis', 'https://github.com/FunkinCrew/funkVis', '22b1ce089dd924f15cdc4632397ef3504d464e90')
          Invoke-Haxelib @('git', 'grig.audio', 'https://gitlab.com/haxe-grig/grig.audio.git', 'cbf91e2180fd2e374924fe74844086aab7891666')

      - name: Build Windows
        shell: pwsh
        run: haxelib run lime build windows -release

      # GitHub packages the uploaded folder as a .zip when you download the artifact.
      - name: Upload Windows build (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Windows
          path: export/release/windows/bin/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: echo "root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"

      # The NDK download is large and slow, so it is cached together with the platform and build tools.
      - name: Cache Android SDK and NDK
        id: android-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/ndk/21.4.7075529
            ${{ steps.sdk.outputs.root }}/platforms/android-31
            ${{ steps.sdk.outputs.root }}/build-tools/31.0.0
          key: android-sdk-ndk21.4.7075529-platform31-v1

      - name: Install Android SDK and NDK
        if: steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-31" "build-tools;31.0.0"

          for attempt in 1 2 3; do
            echo "Installing NDK 21.4.7075529 (attempt $attempt/3)..."
            rm -rf "$NDK_DIR"

            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;21.4.7075529"
            SDK_EXIT=$?
            set -o pipefail

            # sdkmanager can exit non-zero when the confirmation pipe closes,
            # so the real check is whether the NDK was completely installed.
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "OK: NDK 21.4.7075529 installed correctly."
              break
            fi

            echo "NDK installation failed or is incomplete (sdkmanager exit: $SDK_EXIT)."
            rm -rf "$NDK_DIR"

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Could not install NDK 21.4.7075529 after 3 attempts."
              exit 1
            fi

            sleep 5
          done

      - name: Export Android paths
        shell: bash
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: NDK 21.4.7075529 is missing."
            exit 1
          fi

          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Haxe libraries
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Cache hxcpp objects
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: hxcpp-android-${{ github.sha }}
          restore-keys: |
            hxcpp-android-

      - name: Set up Haxelib
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.haxelib"
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      - name: Install Haxe dependencies
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          haxelib_retry() {
            local attempt=1
            echo "Installing: haxelib $*"
            while [ "$attempt" -le 3 ]; do
              local status=0
              if timeout 8m haxelib "$@"; then
                return 0
              else
                status=$?
              fi
              echo "::warning::haxelib $* failed or timed out (attempt $attempt/3, exit $status)."
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
              attempt=$((attempt + 1))
            done
            echo "::error::haxelib $* failed after 3 attempts."
            return 1
          }
          haxelib_retry install hxcpp 4.3.2 --always
          haxelib_retry install lime 8.1.2 --always
          haxelib_retry install openfl 9.3.3 --always
          haxelib_retry install flixel 5.6.1 --always
          haxelib_retry install flixel-addons 3.2.2 --always
          haxelib_retry install flixel-tools 1.5.1 --always
          haxelib_retry install hscript-iris 1.1.3 --always
          haxelib_retry install tjson 1.4.0 --always
          haxelib_retry install hxvlc 2.0.1 --skip-dependencies --always
          haxelib_retry set hxcpp 4.3.2
          haxelib_retry set lime 8.1.2
          haxelib_retry set openfl 9.3.3
          haxelib_retry git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib_retry git linc_luajit https://github.com/superpowers04/linc_luajit 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib_retry git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib_retry git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666

      # Only arm64-v8a is built (almost every modern phone). Building three ABIs
      # triples the C++ compile time. Add the other lines back if you need them.
      - name: Configure Android ABI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Project.xml")
          text = path.read_text(encoding="utf-8")

          line = '  <architecture name="arm64-v8a" if="android" />'

          if line not in text:
              text = text.replace("</project>", "\n" + line + "\n</project>", 1)
              path.write_text(text, encoding="utf-8")
          PY

          grep '<architecture name=' Project.xml || true

      - name: Configure Lime for Android
        shell: bash
        run: haxelib run lime setup android

      # No "lime clean" here on purpose: cleaning would throw away the cached objects.
      - name: Build Android APK
        shell: bash
        run: haxelib run lime build android -release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3-FNF-Port-Android
          path: export/**/*.apk
          if-no-files-found: error
          retention-days: 14
